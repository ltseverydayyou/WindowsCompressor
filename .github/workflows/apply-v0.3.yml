name: Apply v0.3 source update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source and icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcB64 = ((Get-ChildItem '.github/v03/src.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          $srcZip = Join-Path $env:RUNNER_TEMP 'v03-source.zip'
          $srcBytes = [Convert]::FromBase64String($srcB64)
          [IO.File]::WriteAllBytes($srcZip, $srcBytes)
          $srcHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($srcBytes)).ToLowerInvariant()
          Write-Host "Source bytes=$($srcBytes.Length) sha256=$srcHash"
          if ($srcHash -ne 'e5e9cdfbc4542adeaeae3fd96b9160b42cf5808782679dd36ad8a78d26800552') { throw 'Source payload hash mismatch' }
          & tar.exe -xf $srcZip -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "tar failed with $LASTEXITCODE" }

          $iconB64 = ((Get-ChildItem '.github/v03/icon.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          $iconBytes = [Convert]::FromBase64String($iconB64)
          $iconHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($iconBytes)).ToLowerInvariant()
          Write-Host "Icon bytes=$($iconBytes.Length) sha256=$iconHash"
          if ($iconHash -ne '7867e79595085df051ae8de96397c0b788d76e6b84a142c65bc2833b093b9c12') { throw 'Icon payload hash mismatch' }
          New-Item -ItemType Directory -Force -Path 'Assets' | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'Assets\AppIcon.ico'), $iconBytes)

          Remove-Item '.github/v03' -Recurse -Force
          Remove-Item '.github/update-v0.3.zip.b64' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/apply-v0.3.yml' -Force

      - name: Commit update
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add target-size compression and custom app icon'
          git push
