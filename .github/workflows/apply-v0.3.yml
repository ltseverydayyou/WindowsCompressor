name: Apply v0.3 source update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source payload
        shell: pwsh
        run: |
          $payload = Get-Content '.github/update-v0.3.zip.b64' -Raw
          $zip = Join-Path $env:RUNNER_TEMP 'update-v0.3.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($payload.Trim()))
          Expand-Archive -Path $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          Remove-Item '.github/update-v0.3.zip.b64' -Force

      - name: Commit update
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add target-size compression and custom app icon'
          git push
