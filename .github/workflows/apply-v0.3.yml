name: Apply v0.3 source update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source and icon
        shell: pwsh
        run: |
          $srcB64 = ((Get-ChildItem '.github/v03/src.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          $srcZip = Join-Path $env:RUNNER_TEMP 'v03-source.zip'
          [IO.File]::WriteAllBytes($srcZip, [Convert]::FromBase64String($srcB64))
          Expand-Archive -Path $srcZip -DestinationPath $env:GITHUB_WORKSPACE -Force

          $iconB64 = ((Get-ChildItem '.github/v03/icon.part*' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          New-Item -ItemType Directory -Force -Path 'Assets' | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'Assets\AppIcon.ico'), [Convert]::FromBase64String($iconB64))

          Remove-Item '.github/v03' -Recurse -Force
          Remove-Item '.github/update-v0.3.zip.b64' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/apply-v0.3.yml' -Force

      - name: Commit update
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add target-size compression and custom app icon'
          git push
