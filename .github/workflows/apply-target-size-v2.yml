name: Apply target size v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply target-size files
        shell: python
        env:
          XAML_B64: 
          CS_B64: 
          SVC_B64: 
        run: |
          import base64, gzip, os, pathlib
          data = {
              'MainWindow.xaml': os.environ['XAML_B64'],
              'MainWindow.xaml.cs': os.environ['CS_B64'],
              'Services/CompressionService.cs': os.environ['SVC_B64'],
          }
          for path, value in data.items():
              pathlib.Path(path).write_bytes(gzip.decompress(base64.b64decode(value)))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.xaml.cs Services/CompressionService.cs
          git commit -m "Improve target MB compression controls" || exit 0
          git push