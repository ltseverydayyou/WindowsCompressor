name: Save output folder persistence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Patch output folder persistence
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("MainWindow.xaml.cs")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              "using System.Text.RegularExpressions;\n",
              "using System.Text.Json;\nusing System.Text.RegularExpressions;\n",
              1,
          )

          old = '''        OutputTextBox.Text = Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.UserProfile),
              "Downloads", "Compressed");
          UpdateCompressionModeUI();
          UpdateQueueUi();
              Loaded += MainWindow_Loaded;
          '''
          new = '''        OutputTextBox.Text = LoadOutputFolder();
          UpdateCompressionModeUI();
          UpdateQueueUi();
          Loaded += MainWindow_Loaded;
          Closing += (_, _) => SaveOutputFolder();
          '''
          if old not in text:
              raise SystemExit("constructor output folder block not found")
          text = text.replace(old, new, 1)

          old = '''        if (dialog.ShowDialog(this) == true)
              OutputTextBox.Text = dialog.FolderName;
          '''
          new = '''        if (dialog.ShowDialog(this) == true)
          {
              OutputTextBox.Text = dialog.FolderName;
              SaveOutputFolder();
          }
          '''
          if old not in text:
              raise SystemExit("browse block not found")
          text = text.replace(old, new, 1)

          old = '''        var output = OutputTextBox.Text.Trim();
          if (string.IsNullOrWhiteSpace(output))
          '''
          new = '''        var output = OutputTextBox.Text.Trim();
          SaveOutputFolder();
          if (string.IsNullOrWhiteSpace(output))
          '''
          if old not in text:
              raise SystemExit("compress output block not found")
          text = text.replace(old, new, 1)

          marker = '''    private static string Condense(string value)
          '''
          methods = '''    private static string SettingsFilePath => Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
              "WindowsCompressor",
              "settings.json");

          private static string DefaultOutputFolder => Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.UserProfile),
              "Downloads",
              "Compressed");

          private static string LoadOutputFolder()
          {
              try
              {
                  if (!File.Exists(SettingsFilePath))
                      return DefaultOutputFolder;

                  var json = File.ReadAllText(SettingsFilePath);
                  var settings = JsonSerializer.Deserialize<AppSettings>(json);
                  return string.IsNullOrWhiteSpace(settings?.OutputFolder)
                      ? DefaultOutputFolder
                      : settings.OutputFolder;
              }
              catch
              {
                  return DefaultOutputFolder;
              }
          }

          private void SaveOutputFolder()
          {
              var output = OutputTextBox.Text.Trim();
              if (string.IsNullOrWhiteSpace(output))
                  return;

              try
              {
                  var directory = Path.GetDirectoryName(SettingsFilePath);
                  if (!string.IsNullOrWhiteSpace(directory))
                      Directory.CreateDirectory(directory);

                  var json = JsonSerializer.Serialize(new AppSettings { OutputFolder = output });
                  File.WriteAllText(SettingsFilePath, json);
              }
              catch
              {
              }
          }

          private sealed class AppSettings
          {
              public string? OutputFolder { get; set; }
          }

          '''
          if marker not in text:
              raise SystemExit("Condense marker not found")
          text = text.replace(marker, methods + marker, 1)
          p.write_text(text, encoding="utf-8", newline="\n")
          '@ | Set-Content patch.py -Encoding UTF8
          python patch.py
          Remove-Item patch.py

      - name: Build
        shell: pwsh
        run: dotnet publish WindowsCompressor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\publish\Compressor.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Compressor exited during startup. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Commit persistence fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml.cs
          git commit -m "Persist selected output folder"
          git push

      - name: Replace v0.3.1 executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.3.1 "$PWD\publish\Compressor.exe" --clobber
