name: Fix v0.3.1 startup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup animations
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          xaml = Path("MainWindow.xaml")
          text = xaml.read_text(encoding="utf-8")
          pattern = re.compile(r'(?s)(<Grid x:Name="RootShell"[^>]*>\s*<Grid\.RenderTransform>.*?</Grid\.RenderTransform>)\s*<Grid\.Triggers>\s*<EventTrigger RoutedEvent="FrameworkElement\.Loaded">.*?</Grid\.Triggers>')
          text, count = pattern.subn(r'\1', text, count=1)
          if count != 1:
              raise SystemExit("Root startup storyboard block not found")
          xaml.write_text(text, encoding="utf-8", newline="\n")

          cs = Path("MainWindow.xaml.cs")
          text = cs.read_text(encoding="utf-8")

          marker = '''        UpdateCompressionModeUI();
              UpdateQueueUi();
          }

              private void TitleBar_MouseLeftButtonDown'''
          replacement = '''        UpdateCompressionModeUI();
              UpdateQueueUi();
              Loaded += MainWindow_Loaded;
          }

              private void MainWindow_Loaded(object sender, RoutedEventArgs e)
              {
                  Loaded -= MainWindow_Loaded;

                  try
                  {
                      RootShell.BeginAnimation(OpacityProperty, new DoubleAnimation
                      {
                          From = 0,
                          To = 1,
                          Duration = TimeSpan.FromMilliseconds(240),
                          EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }
                      });

                      RootTranslate.BeginAnimation(System.Windows.Media.TranslateTransform.YProperty, new DoubleAnimation
                      {
                          From = 10,
                          To = 0,
                          Duration = TimeSpan.FromMilliseconds(280),
                          EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }
                      });
                  }
                  catch
                  {
                      RootShell.BeginAnimation(OpacityProperty, null);
                      RootTranslate.BeginAnimation(System.Windows.Media.TranslateTransform.YProperty, null);
                      RootShell.Opacity = 1;
                      RootTranslate.Y = 0;
                  }
              }

              private void TitleBar_MouseLeftButtonDown'''
          if marker not in text:
              marker = marker.replace('              ', '    ')
              replacement = replacement.replace('              ', '    ')
          if marker not in text:
              raise SystemExit("Constructor marker not found")
          text = text.replace(marker, replacement, 1)

          new_mode_method = '''    private void UpdateCompressionModeUI()
              {
                  if (TargetSizePanel is null || QualityCombo is null || CompressionModeCombo is null) return;

                  var targetMode = SelectedText(CompressionModeCombo).Equals("Target size", StringComparison.OrdinalIgnoreCase);
                  TargetSizePanel.IsEnabled = !_isBusy;
                  QualityCombo.IsEnabled = !targetMode && !_isBusy;

                  var targetOpacity = _isBusy ? 0.55 : targetMode ? 1.0 : 0.82;
                  var qualityOpacity = _isBusy ? 0.55 : targetMode ? 0.5 : 1.0;

                  if (!IsLoaded)
                  {
                      TargetSizePanel.BeginAnimation(OpacityProperty, null);
                      QualityCombo.BeginAnimation(OpacityProperty, null);
                      TargetSizePanel.Opacity = targetOpacity;
                      QualityCombo.Opacity = qualityOpacity;
                      return;
                  }

                  try
                  {
                      TargetSizePanel.BeginAnimation(OpacityProperty, new DoubleAnimation
                      {
                          To = targetOpacity,
                          Duration = TimeSpan.FromMilliseconds(160),
                          EasingFunction = new QuadraticEase { EasingMode = EasingMode.EaseOut }
                      });

                      QualityCombo.BeginAnimation(OpacityProperty, new DoubleAnimation
                      {
                          To = qualityOpacity,
                          Duration = TimeSpan.FromMilliseconds(160),
                          EasingFunction = new QuadraticEase { EasingMode = EasingMode.EaseOut }
                      });
                  }
                  catch
                  {
                      TargetSizePanel.BeginAnimation(OpacityProperty, null);
                      QualityCombo.BeginAnimation(OpacityProperty, null);
                      TargetSizePanel.Opacity = targetOpacity;
                      QualityCombo.Opacity = qualityOpacity;
                  }
              }

              private void TargetPreset_Click'''.replace('              ', '    ')
          text, count = re.subn(r'(?s)    private void UpdateCompressionModeUI\(\)\s*\{.*?\n    \}\n\n    private void TargetPreset_Click', new_mode_method, text, count=1)
          if count != 1:
              raise SystemExit("UpdateCompressionModeUI method not found")

          text = text.replace('if (FooterPill is not null)\n        {\n            FooterPill.BeginAnimation', 'if (FooterPill is not null && IsLoaded)\n        {\n            FooterPill.BeginAnimation', 1)
          cs.write_text(text, encoding="utf-8", newline="\n")
          '@ | Set-Content -Path fix_v031.py -Encoding UTF8
          python fix_v031.py
          Remove-Item fix_v031.py
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.xaml.cs
          git diff --cached --check
          git commit -m "Fix v0.3.1 startup crash"
          git push origin HEAD:main
